<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="HUMANi">
  <!-- Flat recreation of the HUMANi mark: a friendly figure inside a browser
       window, with a cursor. Two colors only; no gradients. -->
  <!-- Browser window -->
  <rect x="10" y="12" width="108" height="100" rx="14" fill="#FFFFFF" stroke="#4285F4" stroke-width="7" />
  <!-- Header divider -->
  <rect x="10" y="36" width="108" height="7" fill="#4285F4" />
  <!-- Top-bar dots -->
  <circle cx="29" cy="27" r="5.5" fill="#4285F4" />
  <circle cx="47" cy="27" r="5.5" fill="#4285F4" />
  <circle cx="64" cy="27" r="5.5" fill="#4285F4" />
  <!-- Figure: body first, head drawn over it. The body reaches the frame's
       bottom edge, like the original. -->
  <path d="M34 110 C34 89 47 81 64 81 C81 81 94 89 94 110 L34 110 Z" fill="#4285F4" />
  <circle cx="64" cy="65" r="22" fill="#FFFFFF" stroke="#4285F4" stroke-width="7" />
  <rect x="55.5" y="56" width="6" height="17" rx="3" fill="#141B4D" />
  <rect x="66.5" y="56" width="6" height="17" rx="3" fill="#141B4D" />
  <!-- Cursor, with a white halo so it reads over the frame edge -->
  <path d="M91 85 L123 96.5 L109 103.5 L103.5 118 Z" fill="#4285F4" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke" />
</svg>
